<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Bogizm | Infected Titan TV Man</title>
    <style>
        /* Картинка задаётся ОДИН раз — в скрипте внизу (BG_URL).
           Пока она не загрузилась, здесь стоит none. */
        :root {
            --bg-image: none;
        }

        /* Базовые сбросы */
        * {
            box-sizing: border-box;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 🖥️ ПК: Картинка и градиент живут в одном контейнере без стыков и швов */
        .leak-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65vh; /* На ПК занимает 65% высоты экрана */
            background-image: 
                linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.9) 85%, #000000 100%), 
                var(--bg-image); 
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;

            /* ✨ FADE IN КАРТИНКИ: невидима, пока не загрузится.
               Класс .loaded добавляется скриптом после загрузки и декодирования картинки.
               Длительность плавного появления — 1.8s (меняй здесь). */
            opacity: 0;
            transition: opacity 1.8s ease;
        }

        .leak-background.loaded {
            opacity: 1;
        }

        /* ⏳ LOADER: надпись, пока грузится картинка.
           Стоит по центру зоны картинки, плавно появляется (fade in), пульсирует,
           а когда картинка готова — плавно исчезает (fade out) и уступает ей место. */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65vh; /* та же высота, что у картинки на ПК */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
            opacity: 1;
            /* Длительность fade out — 0.9s. visibility убирает блок полностью после исчезновения */
            transition: opacity 0.9s ease, visibility 0s linear 0.9s;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-text {
            padding: 0 16px;
            text-align: center;
            /* Адаптивный шрифт: растёт с шириной экрана, но не меньше и не больше заданных пределов */
            font-size: clamp(1.05rem, 5vw, 1.9rem);
            letter-spacing: clamp(2px, 1vw, 6px);
            font-weight: 600;
            text-transform: uppercase;
            color: #e8e8ec;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
            /* Сначала fade in за 1s, затем бесконечная мягкая пульсация */
            animation: loaderIn 1s ease-out both, loaderPulse 2s ease-in-out 1s infinite;
        }

        @keyframes loaderIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes loaderPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }

        /* Основной контент поверх всего */
        .content-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 100vh;
            padding-bottom: 8vh;
            text-align: center;
        }

        /* ✨ FADE IN ТЕКСТА: плавное появление снизу вверх */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Заголовок "Next Bogizm" */
        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0 0 5px 0;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            animation: fadeUp 1.2s ease-out 0.3s both; /* длительность, задержка */
        }

        /* Желтый переливающийся текст */
        .character-tag {
            font-size: 1.4rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 35px;
            background: linear-gradient(90deg, #ffe066, #f59e0b, #fef08a, #ffe066);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeUp 1.2s ease-out 0.7s both, textShine 4s linear infinite;
            filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.5));
        }

        /* Область таймера: сюда же накладывается надпись Done. после окончания отсчёта */
        .timer-area {
            position: relative;
            display: flex;
            justify-content: center;
        }

        /* Контейнер таймера */
        .countdown-wrapper {
            display: flex;
            gap: 25px;
            justify-content: center;
            animation: fadeUp 1.2s ease-out 1.1s both;
        }

        /* ✅ ПОСЛЕ ОКОНЧАНИЯ ОТСЧЁТА */
        @keyframes fadeOut {
            from { opacity: 1; }
            to   { opacity: 0; visibility: hidden; }
        }

        /* Отсчёт закончился на глазах у посетителя: таймер плавно исчезает */
        .countdown-wrapper.finished {
            animation: fadeOut 0.8s ease forwards;
        }

        /* Посетитель зашёл уже после окончания: таймера нет сразу, без анимации */
        .countdown-wrapper.finished-static {
            animation: none;
            opacity: 0;
            visibility: hidden;
        }

        .countdown-wrapper.finished .time-block::before,
        .countdown-wrapper.finished-static .time-block::before {
            animation-play-state: paused;
        }

        /* Надпись Done. — стоит ровно на месте таймера, поэтому вёрстка не прыгает */
        .done-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            font-size: clamp(2.6rem, 11vw, 4.5rem); /* адаптивный размер */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: clamp(2px, 1vw, 6px);
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .done-text.show {
            visibility: visible;
            animation: fadeUp 1.2s ease-out var(--done-delay, 1.1s) both;
        }

        /* БЛОК С ЭФФЕКТОМ БЕГАЮЩЕЙ БЕЛОЙ ЗМЕЙКИ */
        .time-block {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 16px;
            background: rgba(10, 10, 12, 0.9);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .time-block:hover {
            transform: scale(1.05);
        }

        /* Вращающаяся белая змейка на рамке */
        .time-block::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, transparent, transparent, #ffffff);
            animation: snakeRotate 4s linear infinite;
        }

        /* Внутренняя плашка */
        .time-block-inner {
            position: absolute;
            inset: 3px;
            background: #0f0f12;
            border-radius: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .time-number {
            font-size: 3rem;
            font-weight: 800;
            font-family: monospace;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #88888e;
            margin-top: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* АНИМАЦИИ */
        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        @keyframes snakeRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 📱 МОБИЛКИ */
        @media (max-width: 768px) {
            :root {
                /* Высота картинки на мобилке: меняй это значение, чтобы уменьшить/увеличить персонажа.
                   Например, 65svh — меньше, 85svh — крупнее.
                   Под неё автоматически подстраивается и градиент, и положение надписи Loading. */
                --mobile-image-height: 77svh;
            }

            .leak-background {
                height: 100vh;
                height: 100svh;

                background-color: #000000;

                /* Градиент той же высоты, что и картинка (+2px запаса от шва),
                   внизу — чистый чёрный, поэтому нижний край картинки не виден. */
                background-size: 100% calc(var(--mobile-image-height) + 2px), auto var(--mobile-image-height);
                background-position: center top, center top;
                background-repeat: no-repeat;
                background-image:
                    linear-gradient(to bottom,
                        transparent 0%,
                        rgba(0, 0, 0, 0.25) 35%,
                        rgba(0, 0, 0, 0.6) 60%,
                        rgba(0, 0, 0, 0.9) 85%,
                        #000000 100%),
                    var(--bg-image);
            }

            .loader {
                /* Надпись по центру зоны картинки */
                height: var(--mobile-image-height);
            }

            .content-container {
                /* Не даём заголовку уехать за край на низких экранах */
                min-height: 100vh;
                min-height: 100svh;
                justify-content: flex-end;
                padding: 24px 12px max(28px, 6svh);
                gap: 0;
            }

            h1 {
                max-width: 100%;
                font-size: clamp(1.65rem, 7.2vw, 2.4rem);
                line-height: 1.12;
                letter-spacing: clamp(1px, 0.55vw, 2px);
                overflow-wrap: anywhere;
            }

            .character-tag {
                max-width: 100%;
                font-size: clamp(0.75rem, 3.6vw, 1.1rem);
                line-height: 1.3;
                letter-spacing: clamp(0.5px, 0.5vw, 2px);
                margin: 0 0 clamp(20px, 5vh, 30px);
                overflow-wrap: anywhere;
            }

            .timer-area {
                width: 100%;
            }

            .countdown-wrapper {
                width: 100%;
                max-width: 360px;
                gap: clamp(7px, 2.5vw, 12px);
                justify-content: center;
            }

            .time-block {
                flex: 1 1 0;
                min-width: 0;
                width: auto;
                max-width: 95px;
                height: auto;
                aspect-ratio: 1;
                border-radius: 12px;
            }

            .time-block-inner { 
                inset: 2px; 
                border-radius: 10px; 
            }

            .time-label {
                font-size: clamp(0.48rem, 2.1vw, 0.55rem);
                margin-top: 4px;
                letter-spacing: 0.5px;
                text-align: center;
            }

            .time-number {
                font-size: clamp(1.7rem, 8vw, 2.2rem);
            }
        }

        @media (max-width: 360px) {
            .content-container {
                padding-left: 8px;
                padding-right: 8px;
            }

            .countdown-wrapper {
                gap: 7px;
            }
        }
    </style>
</head>
<body>

    <!-- ЗДЕСЬ ОБЪЕДИНЕНЫ КАРТИНКА И ГРАДИЕНТ -->
    <div class="leak-background"></div>

    <!-- ⏳ Надпись, пока грузится картинка -->
    <div class="loader" role="status" aria-live="polite">
        <span class="loader-text">Loading Bogizm...</span>
    </div>

    <!-- Основной контент -->
    <div class="content-container">
        <h1>Next Bogizm</h1>
        <div class="character-tag">Infected Titan TV Man</div>

        <div class="timer-area">
            <div class="countdown-wrapper" id="countdown">
                <div class="time-block">
                    <div class="time-block-inner">
                        <div class="time-number" id="hours">00</div>
                        <div class="time-label">Hours</div>
                    </div>
                </div>
                <div class="time-block">
                    <div class="time-block-inner">
                        <div class="time-number" id="minutes">00</div>
                        <div class="time-label">Minutes</div>
                    </div>
                </div>
                <div class="time-block">
                    <div class="time-block-inner">
                        <div class="time-number" id="seconds">00</div>
                        <div class="time-label">Seconds</div>
                    </div>
                </div>
            </div>

            <!-- Надпись после окончания отсчёта -->
            <div class="done-text" id="done" aria-hidden="true">Done.</div>
        </div>
    </div>

    <!-- ✨ ЗАГРУЗКА КАРТИНКИ: надпись Loading исчезает, картинка плавно появляется -->
    <script>
        const BG_URL = 'https://github.com/eminexcybernetics/next-bogizm/raw/refs/heads/main/con2fig.sys';

        // Минимальное время показа надписи Loading (мс).
        // Нужно, чтобы при быстрой загрузке (например, из кэша) она не мелькала на долю секунды.
        // Поставь 0, если хочешь, чтобы она пропадала сразу, как только картинка готова.
        const MIN_LOADER_MS = 1000;

        (function () {
            const bg = document.querySelector('.leak-background');
            const loader = document.querySelector('.loader');
            const startedAt = performance.now();

            // Плавно убираем надпись и (если картинка загрузилась) плавно показываем картинку
            function reveal(showImage) {
                const wait = Math.max(0, MIN_LOADER_MS - (performance.now() - startedAt));
                setTimeout(function () {
                    loader.classList.add('hidden');
                    if (showImage) {
                        requestAnimationFrame(function () {
                            bg.classList.add('loaded');
                        });
                    }
                }, wait);
            }

            const img = new Image();

            img.onload = function () {
                // Картинка скачана — подставляем её в фон
                document.documentElement.style.setProperty('--bg-image', "url('" + BG_URL + "')");

                // Ждём, пока браузер её декодирует, и только потом запускаем fade in
                const decoded = img.decode ? img.decode() : Promise.resolve();
                decoded.catch(function () {}).then(function () {
                    reveal(true);
                });
            };

            // Если картинка не загрузилась — не оставляем надпись висеть вечно
            img.onerror = function () {
                reveal(false);
            };

            img.src = BG_URL;
        })();
    </script>

    <!-- 🕒 ТАЙМЕР: один раз, до фиксированного момента, одинаковый для всех посетителей -->
    <script>
        // 21:55 по Владивостоку (UTC+10), 27 октября 2026.
        // Смещение +10:00 зашито прямо в строку, поэтому момент окончания один и тот же
        // для всех посетителей в любой точке мира. Чтобы сменить время — меняй дату и часы,
        // а "+10:00" оставь.
        const TARGET_TIME = new Date('2026-10-27T21:55:00+10:00').getTime();

        const countdownEl = document.getElementById('countdown');
        const doneEl = document.getElementById('done');

        let timerId = null;
        let finished = false;
        let wasRunning = false; // true, если посетитель застал отсчёт «вживую»

        function finishCountdown() {
            if (finished) return;
            finished = true;
            clearInterval(timerId);

            if (wasRunning) {
                // Отсчёт закончился на глазах у посетителя: таймер плавно исчезает, потом появляется Done.
                countdownEl.classList.add('finished');
                doneEl.style.setProperty('--done-delay', '0.6s');
            } else {
                // Посетитель зашёл уже после окончания: сразу показываем Done.
                countdownEl.classList.add('finished-static');
            }

            doneEl.classList.add('show');
            doneEl.removeAttribute('aria-hidden');
        }

        function updateTimer() {
            const distance = TARGET_TIME - Date.now();

            if (distance <= 0) {
                finishCountdown();
                return;
            }
            wasRunning = true;

            const totalSeconds = Math.floor(distance / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        // Первый запуск сразу, затем обновление (если отсчёт ещё не закончился)
        updateTimer();
        if (!finished) {
            timerId = setInterval(updateTimer, 250);
        }
    </script>
</body>
</html>
