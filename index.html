<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Bogizm | Infected Titan TV Man</title>
    <style>
        /* Базовые сбросы */
        * {
            box-sizing: border-box;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* КОНТЕЙНЕР ДЛЯ КАРТИНКИ: На компах 65vh, на мобилках растянется на весь экран */
        .leak-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65vh;
            background-image: url('config.sys'); 
            background-size: cover;
            background-position: center top;
            z-index: 1;
        }

        /* УЛЬТИМАТИВНЫЙ ГРАДИЕНТ БЕЗ СТЫКОВ */
        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, 
                transparent 0%, 
                rgba(0, 0, 0, 0.2) 40%, 
                rgba(0, 0, 0, 0.8) 60%, 
                #000000 80%
            );
            z-index: 2;
            pointer-events: none;
        }

        /* Основной контент поверх всего */
        .content-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 100vh;
            padding-bottom: 8vh;
            text-align: center;
        }

        /* Заголовок "Next Bogizm" */
        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0 0 5px 0;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Желтый переливающийся текст */
        .character-tag {
            font-size: 1.4rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 35px;
            background: linear-gradient(90deg, #ffe066, #f59e0b, #fef08a, #ffe066);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 4s linear infinite;
            filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.5));
        }

        /* Контейнер таймера */
        .countdown-wrapper {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        /* БЛОК С ЭФФЕКТОМ БЕГАЮЩЕЙ БЕЛОЙ ЗМЕЙКИ */
        .time-block {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 16px;
            background: rgba(10, 10, 12, 0.9);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .time-block:hover {
            transform: scale(1.05);
        }

        /* Вращающаяся белая змейка на рамке */
        .time-block::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, transparent, transparent, #ffffff);
            animation: snakeRotate 4s linear infinite;
        }

        /* Внутренняя плашка */
        .time-block-inner {
            position: absolute;
            inset: 3px;
            background: #0f0f12;
            border-radius: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .time-number {
            font-size: 3rem;
            font-weight: 800;
            font-family: monospace;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #88888e;
            margin-top: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* АНИМАЦИИ */
        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        @keyframes snakeRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 📱 АВТОНОМНЫЙ ФИКС ДЛЯ МОБИЛЬНЫХ ТЕЛЕФОНОВ */
        @media (max-width: 768px) {
            .leak-background {
                height: 100vh; /* Картинка теперь железно на весь экран мобилки */
                background-position: center 15%; /* Сдвигаем чуть пониже, чтобы лицо Титана было идеально по центру экрана */
            }

            .gradient-overlay {
                /* На мобилках делаем более глубокую заливку снизу вверх, чтобы убрать любые швы */
                background: linear-gradient(to bottom, 
                    rgba(0, 0, 0, 0.1) 0%, 
                    rgba(0, 0, 0, 0.4) 35%, 
                    rgba(0, 0, 0, 0.85) 60%, 
                    #000000 85%
                );
            }

            .content-container {
                padding-bottom: 6vh;
            }

            h1 { 
                font-size: 2.4rem; 
                letter-spacing: 2px;
            }

            .character-tag { 
                font-size: 1.1rem; 
                margin-bottom: 30px; 
            }

            .countdown-wrapper { 
                gap: 12px; 
            }

            .time-block { 
                width: 95px; 
                height: 95px; 
                border-radius: 12px; 
            }

            .time-block-inner { 
                inset: 2px; /* Чуть тоньше змейка на мобилке, чтобы выглядело аккуратно */
                border-radius: 10px; 
            }

            .time-number { 
                font-size: 2.2rem; 
            }

            .time-label { 
                font-size: 0.55rem; 
                margin-top: 4px; 
            }
        }
    </style>
</head>
<body>

    <!-- 1. Картинка -->
    <div class="leak-background"></div>

    <!-- 2. Градиент -->
    <div class="gradient-overlay"></div>

    <!-- 3. Контент -->
    <div class="content-container">
        <h1>Next Bogizm</h1>
        <div class="character-tag">Infected Titan TV Man</div>

        <div class="countdown-wrapper">
            <div class="time-block">
                <div class="time-block-inner">
                    <div class="time-number" id="hours">00</div>
                    <div class="time-label">Hours</div>
                </div>
            </div>
            <div class="time-block">
                <div class="time-block-inner">
                    <div class="time-number" id="minutes">00</div>
                    <div class="time-label">Minutes</div>
                </div>
            </div>
            <div class="time-block">
                <div class="time-block-inner">
                    <div class="time-number" id="seconds">00</div>
                    <div class="time-label">Seconds</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // АВТОМАТИЧЕСКИЙ ОТСЧЕТ ДО 20:15 (Владивосток)
        function updateTimer() {
            const now = new Date();
            const targetDate = new Date();
            targetDate.setHours(20, 15, 0, 0);

            if (now > targetDate) {
                targetDate.setDate(targetDate.getDate() + 1);
            }

            const distance = targetDate - now;

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

</body>
</html>
